[tools]
# Node 24 = 현재 LTS(Krypton). CI 도 mise-action 으로 이 버전을 그대로 쓴다.
node = "24.19.0"
# package.json 의 `packageManager` 필드와 반드시 일치시킬 것.
pnpm = "11.22.0"

[env]
_.path = ["./node_modules/.bin"]

[tasks.dev]
description = "개발 서버"
run = "pnpm dev"

[tasks.build]
description = "클라이언트 빌드 → 타입체크 → SSR 빌드 → 프리렌더"
run = "pnpm build"

[tasks.check]
description = "린트 + 포맷 검사 + 타입체크"
run = ["pnpm lint", "pnpm format:check", "pnpm typecheck"]
